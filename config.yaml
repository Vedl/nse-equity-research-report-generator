market:
  # Cost-of-equity risk-free build (country risk counted ONCE, in the ERP).
  gsec_yield: 0.068            # India 10Y G-Sec nominal yield (May 2026); env GSEC_YIELD
  sovereign_default_spread: 0.0216  # India sovereign default spread embedded in the G-Sec
                               # (Damodaran, Baa3); env SOVEREIGN_DEFAULT_SPREAD.
                               # → default-free rupee risk-free = 0.068 − 0.0216 ≈ 0.0464
  equity_risk_premium: 0.07    # Damodaran India TOTAL ERP (Jan 2026 = mature ERP + India CRP); env INDIA_ERP
  tax_rate: 0.25               # Corporate tax rate (base rate post-2019 cut)
  fallback_usd_inr: 95.0       # Used only when all live USDINR fetches fail
  dividend_payer_yield_threshold: 0.02   # Min yield to use Gordon (else RIM) for implied Ke
  financial_beta_low: 0.6      # Bank levered-regression β sanity band (Rf/ERP-invariant)
  financial_beta_high: 1.6

dcf:
  projection_horizon: 5        # Stage 1: years of explicit FCFF projection at g1
  stage2_fade_years: 5         # Stage 2: years 6-10, linear fade g1 -> terminal growth
  terminal_growth_rate: 0.05   # ~ nominal India GDP growth x 0.7 (Gordon growth)
  revenue_growth_source: historical_cagr   # "historical_cagr" | "manual"
  # revenue_growth_override: 0.12   # uncomment to override with a fixed annual rate

guardrails:                          # valuation plausibility flags (diagnostics, not hard errors)
  value_to_price_low: 0.5            # flag if intrinsic/price below this
  value_to_price_high: 2.0          # flag if intrinsic/price above this
  terminal_value_max_share: 0.75    # flag if PV(terminal) / EV exceeds this
  implied_exit_multiple_low: 4.0    # flag if implied terminal EV/EBITDA below this
  implied_exit_multiple_high: 25.0  # flag if implied terminal EV/EBITDA above this

router:
  capex_intensity_threshold: 0.25    # capex/revenue ratio above which company is "capex-heavy"
  leverage_threshold: 4.0            # net_debt/EBITDA above which company is "highly leveraged"
  financial_keywords:                # industry keywords triggering excess-return model
    - bank
    - nbfc
    - insurance
    - housing finance
    - capital markets

peers:
  max_peers: 5
  # overrides:
  #   RELIANCE: [ONGC.NS, IOC.NS, BPCL.NS, HPCL.NS]
  #   HDFCBANK: [ICICIBANK.NS, KOTAKBANK.NS, AXISBANK.NS, SBIN.NS]

report:
  currency: INR
  output_dir: ./reports
  charts:
    price_history_period: 2y
    figsize: [10, 4]

conglomerates:
